name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYAPP_VERSION: "0.29.0"

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $Version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Check tag is a release on master
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject version ${{ steps.version.outputs.version }}"
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit is not on master" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pyapp-source

      - name: Fetch pyapp source
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ofek/pyapp/releases/download/v$env:PYAPP_VERSION/source.tar.gz" -OutFile pyapp.tar.gz
          New-Item -ItemType Directory pyapp-source | Out-Null
          tar -xzf pyapp.tar.gz -C pyapp-source --strip-components=1
          @{ pyapp_source_path = "pyapp-source"; dist_path = "dist" } | ConvertTo-Json | Set-Content pyapp-build/build-config.json

      - name: Build executables
        shell: pwsh
        run: |
          $Flags = @("-FromSource")
          if ("${{ github.ref_type }}" -eq "tag") { $Flags += "-Release" }
          ./pyapp-build/build-pyapp.ps1 @Flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build wheel and sdist
        shell: pwsh
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist/python

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/*.exe, dist/python/* release/
          $Sums = Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $Sums | Set-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-key-${{ steps.version.outputs.version }}
          path: release/

  release:
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: whisper-key-${{ needs.build-windows.outputs.version }}
          path: release

      - name: Extract changelog section
        run: |
          awk -v v="${{ needs.build-windows.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for ${{ needs.build-windows.outputs.version }}"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
