name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Build an additional GUI launcher without its animated splash
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $Version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$Version" >> $env:GITHUB_OUTPUT
          "prerelease=$($Version -match '(a|b|rc)\d+$')".ToLower() >> $env:GITHUB_OUTPUT

      - name: Check tag is a release on master (or a pre-release on dev)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject version ${{ steps.version.outputs.version }}"
          }
          $Branch = if ("${{ steps.version.outputs.prerelease }}" -eq "true") { "dev" } else { "master" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/$Branch
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit is not on $Branch" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python build tools
        run: python -m pip install --quiet build setuptools wheel

      - name: Fetch pyapp source
        shell: pwsh
        run: |
          ./pyapp-build/fetch-pyapp-source.ps1 -Destination pyapp-source
          Copy-Item pyapp-build/Cargo.lock pyapp-source/Cargo.lock -Force
          @{ pyapp_source_path = "pyapp-source"; dist_path = "dist" } | ConvertTo-Json | Set-Content pyapp-build/build-config.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pyapp-source

      - name: Build executables
        shell: pwsh
        run: |
          ./pyapp-build/build-pyapp.ps1 -FromSource -Release:("${{ github.ref_type }}" -eq "tag") -Diagnostics:("${{ inputs.diagnostics }}" -eq "true")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Collect embedded wheel and build sdist
        shell: pwsh
        run: |
          python -m build --sdist --no-isolation --outdir dist/python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/wheel/*.whl dist/python/

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/*.exe, dist/python/*, dist/BUILD-* release/
          $Sums = Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $Sums | Set-Content release/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-key-${{ steps.version.outputs.version }}
          path: release/

  release:
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: whisper-key-${{ needs.build-windows.outputs.version }}
          path: release

      - name: Extract changelog section
        run: |
          awk -v v="${{ needs.build-windows.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for ${{ needs.build-windows.outputs.version }}"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.build-windows.outputs.prerelease == 'true' }}
          files: release/*
